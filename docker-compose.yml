version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: ledger-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch(e) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] }).ok }' | grep -q 1"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 3s

  api:
    build: .
    container_name: ledger-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/ledger?replicaSet=rs0&directConnection=true
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:

